name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    # Every three hours, offset from the top of the hour.
    # Daily market closing prices are NOT a real-time feed.
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: market-rain-snapshot-main
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch and process market closes
        run: python scripts/update_quotes.py
      - name: Publish new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh delayed market snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
